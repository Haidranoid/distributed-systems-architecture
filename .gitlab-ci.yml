variables:
  GIT_DEPTH: 0

  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_PIPELINES_DIR: infrastructure/gitlab-ci/pipelines
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  GITLAB_CI_TEMPLATES_LIBRARIES_DIR: $GITLAB_CI_TEMPLATES_DIR/libraries
  GITLAB_CI_TEMPLATES_MICROSERVICES_DIR: $GITLAB_CI_TEMPLATES_DIR/microservices

  PROJECT_TYPE_LIBRARY: library
  PROJECT_TYPE_MICROSERVICE: service

  PROJECT_LANG_JAVA: java
  PROJECT_LANG_DOTNET: dotnet

workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend
    include:
      - local: $PROJECT_PIPELINE

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        #- $GITLAB_CI_TEMPLATES_DIR/$PROJECT_KIND/**/*

  variables:
    PROJECT_PIPELINE: "$GITLAB_CI_PIPELINES_DIR/$PROJECT_LANG-$PROJECT_TYPE.yml"

# trigger libraries ==============================================================
trigger-shared-core:
  stage: libraries

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: shared-core
    PROJECT_TYPE: $PROJECT_TYPE_LIBRARY
    PROJECT_LANG: $PROJECT_LANG_JAVA

trigger-shared-starter:
  stage: libraries

  extends: .trigger-template-base
  #needs:
  # - .trigger-shared-core
  variables:
    PROJECT_NAME: shared-starter
    PROJECT_TYPE: $PROJECT_TYPE_LIBRARY_JAVA


# trigger microservices ==============================================================
trigger-config-server:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: config-server
    PROJECT_TYPE: $PROJECT_TYPE_MICROSERVICE_JAVA


trigger-gateway:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: gateway
    PROJECT_TYPE: $PROJECT_TYPE_MICROSERVICE_JAVA


trigger-authentication-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: authentication-service
    PROJECT_TYPE: $PROJECT_TYPE_MICROSERVICE_JAVA
    

trigger-accounts-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: accounts-service
    PROJECT_TYPE: $PROJECT_TYPE_MICROSERVICE_JAVA
    

trigger-audit-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: audit-service
    PROJECT_TYPE: $PROJECT_TYPE_MICROSERVICE_JAVA
    

