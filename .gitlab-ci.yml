variables:
  GIT_DEPTH: 0

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  INFRASTRUCTURE_DIR: infrastructure #TODO
  LIBRARIES_DIR: libraries
  MICROSERVICES_DIR: microservices

  TARGET_TYPE_JAVA: java
  TARGET_TYPE_DOTNET: dotnet

workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend

    include:
      - local: $PROJECT_DIR/.gitlab-ci.yml

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        - $PROJECT_TEMPLATES_DIR/**/*

.trigger-template-base-java:
  extends: .trigger-template-base

  trigger:
    include:
      - local: $GITLAB_CI_BOOTSTRAP_DIR/setup-java.yml


trigger-template-base-dotnet:
  extends: trigger-template-base

  trigger:
    include:
      - local: $GITLAB_CI_BOOTSTRAP_DIR/setup-dotnet.yml


# trigger lang templates ==============================================================
.trigger-template-java:
  extends: .trigger-template-base-java

  trigger:
    include:
      - local: $PROJECT_TEMPLATES_DIR/test-java.yml
      - local: $PROJECT_TEMPLATES_DIR/publish-java.yml
      - local: $PROJECT_TEMPLATES_DIR/deploy-java.yml

trigger-template-dotnet:
  extends: trigger-template-base-dotnet

  trigger:
    include:
      - local: $PROJECT_TEMPLATES_DIR/test-dotnet.yml
      - local: $PROJECT_TEMPLATES_DIR/publish-dotnet.yml
      - local: $PROJECT_TEMPLATES_DIR/deploy-dotnet.yml


# trigger libraries ==============================================================
trigger-shared-core:
  extends: .trigger-template-java
  stage: libraries

  variables:
    PROJECT_NAME: shared-core
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $LIBRARIES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$LIBRARIES_DIR

trigger-shared-starter:
  extends: .trigger-template-java
  stage: libraries

  needs:
    - trigger-shared-core

  variables:
    PROJECT_NAME: shared-starter
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $LIBRARIES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$LIBRARIES_DIR


# trigger microservices ==============================================================
trigger-config-server:
  extends: trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: config-server
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-gateway:
  extends: trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: gateway
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-authentication-service:
  extends: trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: authentication-service
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-accounts-service:
  extends: trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: accounts-service
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-audit-service:
  extends: trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: audit-service
    PROJECT_TYPE: $TARGET_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-media-generation-service:
  extends: trigger-template-dotnet
  stage: microservices

  variables:
    PROJECT_NAME: media-generation-service
    PROJECT_NAME_SOLUTION: MediaGenerationService
    PROJECT_TYPE: $TARGET_TYPE_DOTNET
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR

trigger-content-service:
  extends: trigger-template-dotnet
  stage: microservices

  variables:
    PROJECT_NAME: content-service
    PROJECT_NAME_SOLUTION: ContentService
    PROJECT_TYPE: $TARGET_TYPE_DOTNET
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR
    