variables:
  GIT_DEPTH: 0

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_PIPELINES_DIR: infrastructure/gitlab-ci/pipelines
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  PROJECT_TYPE_JAVA_LIBRARY: java-library
  PROJECT_TYPE_JAVA_MICROSERVICE: java-service
  PROJECT_TYPE_DOTNET_LIBRARY: dotnet-library
  PROJECT_TYPE_DOTNET_MICROSERVICE: dotnet-service

workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend
    include:
      - local: $GITLAB_CI_PIPELINES_DIR/$PROJECT_TYPE.yml

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        - $GITLAB_CI_TEMPLATES_DIR/$PROJECT_KIND/**/*


# trigger libraries ==============================================================
trigger-shared-core:
  stage: libraries

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: shared-core
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_LIBRARY

trigger-shared-starter:
  stage: libraries

  extends: .trigger-template-base
  #needs:
  # - .trigger-shared-core
  variables:
    PROJECT_NAME: shared-starter
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_LIBRARY


# trigger microservices ==============================================================
trigger-config-server:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: config-server
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_MICROSERVICE
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME


trigger-gateway:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: gateway
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_MICROSERVICE
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    

trigger-authentication-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: authentication-service
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_MICROSERVICE
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    

trigger-accounts-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: accounts-service
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_MICROSERVICE
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    

trigger-audit-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: audit-service
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_MICROSERVICE
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    

