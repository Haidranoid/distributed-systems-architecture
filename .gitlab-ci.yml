# trigger libraries ==============================================================
trigger-shared-core:
  stage: libraries

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: shared-core
    PROJECT_KIND: $LIBRARIES_DIR
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_LIBRARY
    PROJECT_DIR: $LIBRARIES_DIR/$PROJECT_NAME

trigger-shared-starter:
  stage: libraries

  extends: .trigger-template-base

  #needs:
  # - .trigger-shared-core

  variables:
    PROJECT_NAME: shared-starter
    PROJECT_KIND: $LIBRARIES_DIR
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_LIBRARY
    PROJECT_DIR: $LIBRARIES_DIR/$PROJECT_NAME


# trigger microservices ==============================================================
trigger-config-server:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: config-server
    PROJECT_TYPE: $PROJECT_TYPE_JAVA_LIBRARY
    PROJECT_DIR: $MICROSERVICES_DIR/$PROJECT_NAME
    

