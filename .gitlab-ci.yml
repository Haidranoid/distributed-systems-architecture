variables:
  GIT_DEPTH: 0

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_PIPELINES_DIR: infrastructure/gitlab-ci/pipelines
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  PROJECT_TYPE_JAVA_LIBRARY: java-library
  PROJECT_TYPE_JAVA_MICROSERVICES: java-microservice
  
  LIBRARIES_DIR: libraries
  MICROSERVICES_DIR: microservices

workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend
    include:
      - local: $GITLAB_CI_PIPELINES_DIR/$PROJECT_TYPE.yml

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        - $GITLAB_CI_TEMPLATES_DIR/$PROJECT_KIND/**/*

