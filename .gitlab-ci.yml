variables:
  GIT_DEPTH: 0

  ARTIFACT_TARGET_LIBRARY: library
  ARTIFACT_TARGET_MICROSERVICE: microservice
  ARTIFACT_LANG_JAVA: java
  ARTIFACT_LANG_DOTNET: dotnet


workflow:
  #name: '$PROJECT_NAME-pipeline'
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend
    include:
      - local: '/infrastructure/gitlab-ci/pipelines/pipeline-$PROJECT_ARTIFACT_TARGET-$PROJECT_ARTIFACT_LANG.yml'

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - /.gitlac-ci.yml
        - '$PROJECT_DIR/$PROJECT_NAME/**/*'

# trigger libraries ==============================================================
trigger-shared-core:
  stage: libraries

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: shared-core
    PROJECT_DIR: libraries
    PROJECT_ARTIFACT_TARGET: '$ARTIFACT_TARGET_LIBRARY'
    PROJECT_ARTIFACT_LANG: '$ARTIFACT_LANG_JAVA'


trigger-shared-starter:
  stage: libraries

  extends: .trigger-template-base

  needs:
    - trigger-shared-core

  variables:
    PROJECT_NAME: shared-starter
    PROJECT_DIR: libraries
    PROJECT_ARTIFACT_TARGET: '$ARTIFACT_TARGET_LIBRARY'
    PROJECT_ARTIFACT_LANG: '$ARTIFACT_LANG_JAVA'


# trigger microservices ==============================================================
trigger-config-server:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: config-server
    PROJECT_DIR: microservices
    PROJECT_ARTIFACT_TARGET: '$ARTIFACT_TARGET_MICROSERVICE'
    PROJECT_ARTIFACT_LANG: '$ARTIFACT_LANG_JAVA'


trigger-gateway:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: gateway
    PROJECT_DIR: microservices
    PROJECT_ARTIFACT_TARGET: '$ARTIFACT_TARGET_MICROSERVICE'
    PROJECT_ARTIFACT_LANG: '$ARTIFACT_LANG_JAVA'


