variables:
  GIT_DEPTH: 0

  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_PIPELINES_DIR: infrastructure/gitlab-ci/pipelines
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  DSA_LIBRARIES_DIR: libraries
  DSA_MICROSERVICES_DIR: microservices

  ARTIFACT_TARGET_LIBRARY: library
  ARTIFACT_TARGET_MICROSERVICE: microservice
  ARTIFACT_LANG_JAVA: java
  ARTIFACT_LANG_DOTNET: dotnet


  GITLAB_CI_TEMPLATES_LIBRARIES_DIR: infrastructure/gitlab-ci/templates/libraries
  GITLAB_CI_TEMPLATES_MICROSERVICES_DIR: infrastructure/gitlab-ci/templates/microservices

  GITLAB_CI_PIPELINE_LIBRARY_JAVA: library-java.yml
  GITLAB_CI_PIPELINE_MICROSERVICE_JAVA: microservice-java.yml


workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates base ==============================================================
.trigger-template-base:
  trigger:
    strategy: depend
    include:
      - local: $GITLAB_CI_PIPELINES_DIR/$PROJECT_PIPELINE

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - $PROJECT_DIR/**/*

# trigger libraries ==============================================================
trigger-shared-core:
  stage: libraries

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: shared-core
    PROJECT_DIR: $DSA_LIBRARIES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $GITLAB_CI_PIPELINE_LIBRARY_JAVA


trigger-shared-starter:
  stage: libraries

  extends: .trigger-template-base

  needs:
   - trigger-shared-core

  variables:
    PROJECT_NAME: shared-starter
    PROJECT_DIR: $DSA_LIBRARIES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $GITLAB_CI_PIPELINE_LIBRARY_JAVA


# trigger microservices ==============================================================
trigger-config-server:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: config-server
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_JAVA.yml


trigger-gateway:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: gateway
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_JAVA.yml


trigger-authentication-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: authentication-service
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_JAVA.yml


trigger-accounts-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: accounts-service
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_JAVA.yml


trigger-audit-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: audit-service
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_JAVA.yml


trigger-media-generation-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: media-generation-service
    PROJECT_NAME_SOLUTION: MediaGenerationService
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_DOTNET.yml


trigger-content-service:
  stage: microservices

  extends: .trigger-template-base

  variables:
    PROJECT_NAME: content-service
    PROJECT_NAME_SOLUTION: ContentService
    PROJECT_DIR: $DSA_MICROSERVICES_DIR/$PROJECT_NAME
    PROJECT_PIPELINE: $ARTIFACT_TARGET_MICROSERVICE-$ARTIFACT_LANG_DOTNET.yml
    