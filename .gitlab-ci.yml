variables:
  GIT_DEPTH: 0

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

  INFRASTRUCTURE_DIR: infrastructure
  
  LIBRARIES_DIR: libraries
  MICROSERVICES_DIR: microservices

  GITLAB_CI_DIR: infrastructure/gitlab-ci
  GITLAB_CI_BOOTSTRAP_DIR: infrastructure/gitlab-ci/bootstrap
  GITLAB_CI_TEMPLATES_DIR: infrastructure/gitlab-ci/templates

  K8S_TEMPLATES_DIR: infrastructure/k8s
  K8S_BASE_TEMPLATES_DIR: infrastructure/k8s/base
  K8S_OVERLAYS_TEMPLATES_DIR: infrastructure/k8s/overlays

  LIBRARY_TYPE_JAVA: java
  LIBRARY_TYPE_DOTNET: dotnet

  MICROSERVICE_TYPE_JAVA: java
  MICROSERVICE_TYPE_DOTNET: dotnet

workflow:
  rules:
    # Merge Requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # Default branch (master/main)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else -> no pipeline
    - when: never

stages:
  - libraries
  - microservices


# trigger templates
.trigger-template-java:
  trigger:
    strategy: depend

    include:
      - local: $PROJECT_DIR/.gitlab-ci.yml
      - local: $GITLAB_CI_BOOTSTRAP_DIR/java/setup-env.yml

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        - $PROJECT_TEMPLATES_DIR/**/*

.trigger-template-dotnet:
  trigger:
    strategy: depend

    include:
      - local: $PROJECT_DIR/.gitlab-ci.yml
      - local: $GITLAB_CI_BOOTSTRAP_DIR/dotnet/setup-env.yml

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - $PROJECT_DIR/**/*
        - $PROJECT_TEMPLATES_DIR/**/*


# libraries
trigger-shared-starter:
  extends: .trigger-template-java
  stage: libraries

  variables:
    PROJECT_NAME: starter
    PROJECT_TYPE: $LIBRARY_TYPE_JAVA
    PROJECT_DIR: $LIBRARIES_DIR/$LIBRARY_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$LIBRARIES_DIR/$LIBRARY_TYPE_JAVA


# microservices
trigger-config-server:
  extends: .trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: config-server
    PROJECT_TYPE: $MICROSERVICE_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA

trigger-gateway:
  extends: .trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: gateway
    PROJECT_TYPE: $MICROSERVICE_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA

trigger-authentication-service:
  extends: .trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: authentication-service
    PROJECT_TYPE: $MICROSERVICE_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA

trigger-accounts-service:
  extends: .trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: accounts-service
    PROJECT_TYPE: $MICROSERVICE_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA

trigger-audit-service:
  extends: .trigger-template-java
  stage: microservices

  variables:
    PROJECT_NAME: audit-service
    PROJECT_TYPE: $MICROSERVICE_TYPE_JAVA
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_JAVA

trigger-media-generation-service:
  extends: .trigger-template-dotnet
  stage: microservices

  variables:
    PROJECT_NAME: media-generation-service
    PROJECT_NAME_SOLUTION: MediaGenerationService
    PROJECT_TYPE: $MICROSERVICE_TYPE_DOTNET
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_DOTNET/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_DOTNET

trigger-content-service:
  extends: .trigger-template-dotnet
  stage: microservices

  variables:
    PROJECT_NAME: content-service
    PROJECT_NAME_SOLUTION: ContentService
    PROJECT_TYPE: $MICROSERVICE_TYPE_DOTNET
    PROJECT_DIR: $MICROSERVICES_DIR/$MICROSERVICE_TYPE_DOTNET/$PROJECT_NAME
    PROJECT_TEMPLATES_DIR: $GITLAB_CI_TEMPLATES_DIR/$MICROSERVICES_DIR/$MICROSERVICE_TYPE_DOTNET
    