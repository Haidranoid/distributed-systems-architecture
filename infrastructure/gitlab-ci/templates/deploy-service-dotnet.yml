deploy:
  stage: deploy
  when: manual
  needs:
    - job: publish
      artifacts: true

  script:
    - cd $PROJECT_K8S_KUSTOMIZATION_DIR

    - |
      kubectl create secret docker-registry ecr-credentials \
      -n dev-local \
      --docker-password=$AWS_ECR_AUTH_PASSWORD \
      --docker-username=AWS \
      --docker-server=$AWS_ECR_REGISTRY_URL \
      --dry-run=client -o yaml | kubectl apply -n dev-local -f -

    - kubectl kustomize . | envsubst | kubectl apply -f -

    - kubectl rollout status deployment/$PROJECT_NAME -n dev-local