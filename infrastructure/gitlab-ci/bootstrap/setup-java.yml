include:
  local: $GITLAB_CI_BOOTSTRAP_DIR/setup-base.yml

default:
  image:
    name: haidranoid/gitlab-runner-java21:latest
    pull_policy: if-not-present

variables:
  PROJECT_DOCKERFILE: $PROJECT_DIR/Dockerfile
  PROJECT_K8S_KUSTOMIZATION_DIR: $K8S_DEV_LOCAL_MICROSERVICES_DIR/$PROJECT_NAME

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true