variables:
  PROJECT_DOCKERFILE: Dockerfile

  GRADLE_USER_HOME: /cache/gradle/$PROJECT_NAME
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

include:
  local: /infrastructure/gitlab-ci/bootstrap/setup-base.yml

default:
  image:
    name: haidranoid/gitlab-runner-java21:latest
    pull_policy: if-not-present

  tags:
    - local
    - java