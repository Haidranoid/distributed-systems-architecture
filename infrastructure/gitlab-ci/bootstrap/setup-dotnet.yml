include:
  local: $GITLAB_CI_BOOTSTRAP_DIR/setup-base.yml

default:
  image:
    name: haidranoid/gitlab-runner-dotnet10:latest
    pull_policy: if-not-present

variables:
  PROJECT_DOCKERFILE: $PROJECT_NAME_SOLUTION/Dockerfile
  PROJECT_K8S_KUSTOMIZATION_DIR: $K8S_DEV_LOCAL_MICROSERVICES_DIR/$PROJECT_NAME