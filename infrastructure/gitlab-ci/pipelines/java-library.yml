stages:
  - test
  - publish
  - deploy

default:
  tags:
    - local
    - java

include:
  - local: $GITLAB_CI_BOOTSTRAP_DIR/setup-java.yml
  - local: $GITLAB_CI_TEMPLATES_DIR/libraries/test-java.yml
  - local: $GITLAB_CI_TEMPLATES_DIR/libraries/publish-java.yml
  - local: $GITLAB_CI_TEMPLATES_DIR/libraries/deploy-java.yml