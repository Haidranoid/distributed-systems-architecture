server:
  port: 8086

spring:
  application:
    name: comments-service
  config:
    import: ${CONFIG_IMPORT:}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    # Service
    org.dsa.services.commentsservice.service: trace

    # Kafka
    org.apache.kafka.common.config.AbstractConfig: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.apache.kafka.clients.producer.KafkaProducer: WARN

    # R2DBC Postgres
    org.springframework.r2dbc.core: DEBUG

    # WebFlux
    # org.springframework.web.reactive.DispatcherHandler: WARN
    org.springframework.web.reactive: warn

    # SpringDoc
    org.springdoc.core.events.SpringDocAppInitializer: ERROR