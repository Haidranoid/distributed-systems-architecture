plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0-RC2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.8.3'
    id 'org.dsa.shared.shared-plugin' version '1.0.0'
}

group = 'org.dsa.services'
version = '1.0.0'
description = 'comments-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    enabled = false
}

repositories {
    // configured by 'org.dsa.shared.shared-plugin'
}

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/*Application*',
                        '**/configuration/**',
                        '**/constant/**',
                        '**/entity/**',
                        '**/properties/**',
                        '**/dto/**',
                        '**/utils/**',
                ])
            })
    )

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            element = 'CLASS'

            excludes = [
                    '*Application*',
                    '*configuration*',
                    '*constant*',
                    '*controller*',
                    '*entity*',
                    '*properties*',
                    '*dto*',
                    '*utils*',
            ]

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

configurations {
    mockitoAgent
}

ext {
    set('googleGuavaVersion', "33.8.0-jre")
    set('springCloudVersion', "2026.0.0-RC2")
    set('springOpenApiVersion', "3.2.0")
    set('springReactorVersion', "2025.0.8")
    set('springSecurityVersion', "7.1.2")
}

dependencyManagement {
    imports {
        mavenBom "com.google.guava:guava-bom:${googleGuavaVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springdoc:springdoc-openapi-bom:${springOpenApiVersion}"
        //mavenBom "io.projectreactor:reactor-bom:${springReactorVersion}"
        //mavenBom "org.springframework.security:spring-security-bom:${springSecurityVersion}"
    }
}

dependencies {
    implementation 'com.google.guava:guava'

    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

    // Messaging
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    //implementation 'org.springframework.security:spring-security-oauth2-jose'

    // HTTP
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Configuration
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Runtime
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'io.projectreactor:reactor-test'

    // Mockito (if used directly by your tests)
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
    testImplementation 'org.mockito:mockito-junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}

test {
    systemProperty "spring.cloud.config.enabled", "false"
    systemProperty "spring.cloud.config.import-check.enabled", "false"
}