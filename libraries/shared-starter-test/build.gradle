dependencies {
    // BOMs
    implementation platform("com.google.guava:guava-bom:${googleGuavaVersion}")
    api platform("org.junit:junit-bom:${jUnitVersion}")
    api platform("org.mockito:mockito-bom:${mockitoVersion}")
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    implementation platform("org.testcontainers:testcontainers-bom:${testContainersVersion}")

    // Core testing framework (JUnit 5)
    implementation 'org.junit.jupiter:junit-jupiter'

    // Mocking library for isolating your service
    implementation 'org.mockito:mockito-core'
    implementation 'org.mockito:mockito-junit-jupiter'

    // Spring Boot
    api 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    implementation 'org.springframework.boot:spring-boot-starter-security-test'
    api 'org.springframework.boot:spring-boot-starter-webmvc-test'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    implementation 'org.springframework.boot:spring-boot-testcontainers'

    // Testcontainers
    implementation 'org.testcontainers:junit-jupiter'
    implementation 'org.testcontainers:postgresql'

    // Extras
    implementation 'com.google.guava:guava-testlib'
    api 'net.datafaker:datafaker:2.7.0'

    // Required launcher to execute tests on the JVM
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}